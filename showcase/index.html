<!doctype html>
<html lang="en" class="h-full">
<head>
	<meta charset="utf-8">
	<title>UI kit showcase</title>
	<base href="/">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<!-- Theme before first paint: the stored choice (localStorage `darkMode`, 'true' or 'false'), else the system's. -->
	<script>(function(){var e=document.documentElement,d;try{d=localStorage.getItem('darkMode')}catch(_){}d=d==null?matchMedia('(prefers-color-scheme: dark)').matches:d==='true';e.classList.toggle('dark',d);e.style.colorScheme=d?'dark':'light'})()</script>
	<style>
		/* Page ground before the styles load: the bg and fg tokens of theme/styles/ui.scss, light and dark. */
		body{background-color:#F3F4EE;color:#1C2B25}
		html.dark>body{background-color:#0F1714;color:#EEEBE0}
	</style>
</head>
<body class="h-full bg-ui-bg text-ui-fg antialiased">
<app-root></app-root>
</body>
</html>
